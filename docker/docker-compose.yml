services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    depends_on: [qdrant]
    ports: ["8000:8000"]
    volumes:
      - app_data:/data
      - ../data/corpus:/app/data/corpus:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_BASE_URL: ws://localhost:8000
        VITE_DEFAULT_CORPUS_ID: northstar_demo_extended
    depends_on: [app]
    ports: ["5173:80"]

volumes:
  qdrant_data:
  app_data:
