services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    depends_on: [qdrant]
    ports: ["8000:8000"]
    volumes: ["app_data:/data"]

volumes:
  qdrant_data:
  app_data:
